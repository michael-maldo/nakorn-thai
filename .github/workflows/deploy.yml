name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci --include=optional
          npm run build
          test -s dist/index.html

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          for name in SSH_KEY KNOWN_HOSTS VPS_HOST; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret for $name. Configure repository secrets or the job's environment."
              exit 1
            fi
          done
          if [[ "$VPS_HOST" =~ [[:space:]] || "$VPS_HOST" == *://* || "$VPS_HOST" == *@* ]]; then
            echo "::error::VPS_HOST must contain only the server IP or hostname, without whitespace, a URL scheme, or username."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /tmp/nakorn-matched-hosts; then
            echo "::error::VPS_KNOWN_HOSTS has no entry matching VPS_HOST. Save the verified full host-key line for the exact deployment hostname or IP."
            exit 1
          fi
          if ! ssh-keygen -lf /tmp/nakorn-matched-hosts > /dev/null 2>&1; then
            echo "::error::The matching VPS_KNOWN_HOSTS entry is not a valid SSH public host key."
            exit 1
          fi

      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="/var/www/nakorn-thai/releases/$release"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "mkdir -p '$destination'"

          rsync -az \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            frontend/dist/ "deploy@$VPS_HOST:$destination/"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" \
            "ln -s '$destination' '/var/www/nakorn-thai/current-$release' &&
             mv -Tf '/var/www/nakorn-thai/current-$release' \
               /var/www/nakorn-thai/current"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
