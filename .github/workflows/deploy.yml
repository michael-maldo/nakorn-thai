name: Deploy website and backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '!frontend/src/staff-pwa-proto/**'
      - '!frontend/staff-pwa-proto/**'
      - '!frontend/vite.proto.config.js'
      - 'infrastructure/**'
      # Workflow-only edits do not publish the existing applications.
      # Use workflow_dispatch when an intentional configuration-only redeploy is needed.
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Also rebuild and activate the backend'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nakorn_menu_test
          POSTGRES_USER: nakorn_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakorn_test -d nakorn_menu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Identify backend changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_BACKEND: ${{ inputs.deploy_backend || false }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "backend=$REQUEST_BACKEND" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- backend infrastructure/scripts/activate-backend.sh infrastructure/systemd; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.changes.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package backend
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          DB_TEST_URL: jdbc:postgresql://localhost:5432/nakorn_menu_test
          DB_TEST_USERNAME: nakorn_test
          DB_TEST_PASSWORD: ci-test-password

          SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 2
          SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          test -s target/nakorn-thai-backend-0.1.0-SNAPSHOT.jar

      - uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        env:
          VITE_STAFF_EPOS_ENABLED: 'false'
        working-directory: frontend
        run: |
          npm ci --include=optional
          npm test
          npm run build
          npm run test:staff-pwa-build
          test -s dist/index.html

      - name: Verify staff PWA and existing staff layouts in Chromium
        working-directory: frontend
        env:
          # No production jobs: this build leaves Epson printing disabled.
          VITE_STAFF_EPOS_ENABLED: 'false'
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/nakorn-vite.log 2>&1 &
          vite_pid=$!
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9223 --user-data-dir=/tmp/nakorn-ci-browser about:blank > /tmp/nakorn-chrome.log 2>&1 &
          chrome_pid=$!
          npm run preview -- --host 127.0.0.1 --port 5175 > /tmp/nakorn-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$chrome_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5174/staff/ >/dev/null && curl -fsS http://127.0.0.1:9223/json/version >/dev/null && curl -fsS http://127.0.0.1:5175/staff/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:staff-pwa-browser
          npm run test:staff-layout-browser
          npm run test:staff-pwa-install-browser

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate backend
        if: steps.changes.outputs.backend == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="/opt/nakorn-thai/backend/releases/$release"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "mkdir -p '$destination'"
          rsync -az \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            backend/target/nakorn-thai-backend-0.1.0-SNAPSHOT.jar \
            "deploy@$VPS_HOST:$destination/backend.jar"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "bash -s -- '$release'" \
            < infrastructure/scripts/activate-backend.sh

      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destination="/var/www/nakorn-thai/releases/$release"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "mkdir -p '$destination'"

          rsync -az \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            frontend/dist/ "deploy@$VPS_HOST:$destination/"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" \
            "ln -s '$destination' '/var/www/nakorn-thai/current-$release' &&
             mv -Tf '/var/www/nakorn-thai/current-$release' \
               /var/www/nakorn-thai/current"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
