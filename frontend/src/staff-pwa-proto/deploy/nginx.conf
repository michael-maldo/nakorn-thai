# Include inside the existing Nakorn Thai HTTPS server block only.
# This release tree is independent of the customer website's current symlink.
location = /staff-pwa-proto {
    return 308 /staff-pwa-proto/;
}
location = /staff-pwa-proto/sw.js {
    alias /var/www/nakorn-thai/prototype/current/staff-pwa-proto/sw.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /staff-pwa-proto/manifest.webmanifest {
    alias /var/www/nakorn-thai/prototype/current/staff-pwa-proto/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
location ^~ /staff-pwa-proto/assets/ {
    alias /var/www/nakorn-thai/prototype/current/staff-pwa-proto/assets/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}
location ^~ /staff-pwa-proto/ {
    alias /var/www/nakorn-thai/prototype/current/staff-pwa-proto/;
    index index.html;
    try_files $uri $uri/ /staff-pwa-proto/index.html;
    add_header Cache-Control "no-cache" always;
}
