plugins { id 'com.android.application' }
def apiBase = providers.gradleProperty('apiBaseUrl').getOrElse('http://10.0.2.2:8080/')
def remote = new URI(apiBase)
if (!apiBase.endsWith('/') || remote.host == null || remote.userInfo != null || remote.query != null || remote.fragment != null || remote.path != '/') {
    throw new GradleException('apiBaseUrl must be an origin URL ending in /, without credentials, path, query or fragment')
}
def localHosts = ['10.0.2.2', '127.0.0.1', 'localhost']
if (remote.scheme != 'https' && !(remote.scheme == 'http' && localHosts.contains(remote.host))) {
    throw new GradleException('Remote API origins require HTTPS. Use adb reverse with localhost for tablet development.')
}
android {
    namespace 'au.com.nakornthai.staffapp'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'au.com.nakornthai.staffapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'au.com.nakornthai.staffapp.TestRunner'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBase + '"'
    }
    buildFeatures { buildConfig true; viewBinding true }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// A release APK must never inherit the emulator development origin.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (remote.scheme != 'https') throw new GradleException('Release builds require -PapiBaseUrl=https://your-approved-origin/')
    }
}
