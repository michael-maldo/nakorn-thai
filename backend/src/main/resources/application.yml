spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  application:
    name: nakorn-thai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nakorn_thai}
    username: ${DB_USERNAME:nakorn_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service_name: ${spring.application.name}
        environment: ${APP_ENV:dev}
  file:
    name: ${LOG_FILE:/tmp/nakorn-thai/backend.json.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${APP_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          transport: http
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
nakorn:
  restaurant-time-zone: Australia/Melbourne
  media-base-url: ${MEDIA_BASE_URL:/media/}
