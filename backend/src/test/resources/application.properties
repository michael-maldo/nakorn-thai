# Cached integration-test contexts must not retain production-sized connection pools.
# Class-level overrides (e.g. PayPal's three-connection locking test) take precedence.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Payment workers are invoked explicitly by reliability tests. Never contact a real provider in tests.
PAYPAL_RECONCILIATION_ENABLED=false
